    <style>
body {
  background-color: gray;
}
a:link {
  color: Pink;
  background-color: Black;
  text-decoration: none;
  transition: all 0.2s;
}

a:visited {
  color: pink;
  background-color: transparent;
  text-decoration: none;
}

a:hover {
  color: purple;
  font-size: 21px;
  background-color: transparent;
  text-decoration: none;
}

a:active {
  color: black;
  background-color: transparent;
  text-decoration: none;
}

\\ body {
  background-image: url("BG.jpg");
  background-size: cover;
  background-position: center;
  background-attachment: fixed;
}

div.section {
  min-height: 100vh;
  margin: 20px;
  background-color: rgba(0, 0, 0, 0.8);
}

html {
  scroll-behavior: smooth;
}

div.menu {
  font-family: "Source Code Pro", system-ui;
  position: fixed;
  left: 0;
  top: 0;
  height: 22px;
  width: 80px;
  overflow: hidden;
  background-color: black;
  color: pink;
  transition: all 0.2s;
}

div.menu:hover {
  height: 120px;
  width: 120px;
  background-color: black;
}

div.header {
  text-align: right;
  font-family: "Source Code Pro", system-ui;
  font-size: 20px;
  transition: all 0.5s;
}

div.header:hover {
  font-size: 22px;
}

p {
  font-size: 25px;
  margin: 10px;
  color: pink;
  text-align: left;
  transition: all 0.2s;
}

h1 {
  color: pink;
}

table {
  margin-left: auto;
  margin-right: auto;
}

p.big {
  font-size: 35px;
  margin: 10px;
  color: pink;
  float: right;
}

img {
  width: 300px;
  transition: all 0.5s;
}

img.move:hover {
  width: 350px;
  rotate: 5deg;
}

img.left {
  float: right;
  padding: 30px;
}
img.bigred {
  float: center;
}

p.order {
  font-size: 45px;
}
