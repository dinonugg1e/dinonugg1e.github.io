<div class="container">
    <h1>BUFORD CLICKER!!!!!</h1>
    <h1>Score: <span id="score">0</span></h1>
    <button id="click-btn">
        <img src="https://codehs.com/uploads/a9bfa72fb5d7b1d0f75bba43cd79cb7a" alt="Icon" style="width:200px; vertical-align:middle;">
        
    </button>
</div>

<script>
    let score = 0;
    const scoreDisplay = document.getElementById('score');
    const clickBtn = document.getElementById('click-btn');
    clickBtn.addEventListener('click', () => {
        score++;
        scoreDisplay.innerText = score;
    });
</script>
